version: '3'

vars:
  DEFT_ROOT: '{{joinPath .TASKFILE_DIR ".."}}'

# roadmap tasks -- consumer-safe CWD + script resolution (#539, #540, #566).
# Scripts are dispatched via {{.DEFT_ROOT}} (defined locally in this file's
# `vars:` block via ``{{joinPath .TASKFILE_DIR ".."}}`` -- see
# ../Taskfile.yml for why root-level definition is avoided) to keep the
# path traversal-free and avoid the {{.TASKFILE_DIR}}/.. form that breaks
# on Windows under `uv --project "{{.DEFT_ROOT}}" run python` (#566).

tasks:
  render:
    desc: Render ROADMAP.md from pending/ proposed/ active/ (forward) and capped completed/
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: :engine:_ts-build
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'roadmap-render --project-root "{{.USER_WORKING_DIR}}"'

  check:
    desc: >-
      Verify ROADMAP.md matches what roadmap:render would produce.
      Wired into FRAMEWORK_CHECK_GATES and check:framework-source (#4164).
      That aggregator is not GitHub merge protection.
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: :engine:_ts-build
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'roadmap-render --project-root "{{.USER_WORKING_DIR}}" --check'

  sync-if-stale:
    desc: >-
      Regenerate ROADMAP.md only when the completed-set projection would drift
      (#4164 producer). Used after task scope:complete / leftover land.
    dir: '{{.USER_WORKING_DIR}}'
    deps:
      - task: :engine:_ts-build
    cmds:
      - task: :engine:invoke
        vars:
          ENGINE_CMD: 'roadmap-render --project-root "{{.USER_WORKING_DIR}}" --sync-if-stale'
